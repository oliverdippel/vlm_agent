backbone:
  name: mock
  model_id: google/paligemma-3b-pt-224
  cache_dir: null

flow:
  action_dim: 7
  hidden_dim: 512
  n_layers: 4
  conditioning_dim: 4096
  dropout: 0.1
  n_euler_steps: 10
  sigma_min: 1e-4

training:
  batch_size: 64
  n_epochs: 50
  grad_clip: 1.0
  ema_decay: 0.999

optimizer:
  name: adamw
  lr: 3e-4
  weight_decay: 1e-4

scheduler:
  name: cosine
  warmup_steps: 500
  t_max: null

data:
  data_dir: data/raw/libero/datasets/libero_spatial
  num_workers: 0
  shuffle: true
  action_stats_path: data/processed/libero/libero_spatial/action_stats.npz
  normalize_actions: true

env:
  task_suite_name: libero_spatial
  task_id: null
  task_name: pick_up_the_black_bowl_on_the_cookie_box_and_place_it_on_the_plate
  img_size: 224

eval:
  enabled: true
  n_eval_episodes: 20
  eval_every_n_epochs: 5

logging:
  checkpoint_dir: models/checkpoints

wandb:
  project: mini-pi0
  mode: online
  run_name: bc_flow_matching

hydra:
  job:
    chdir: false
  
ablation:
  head_type: flow
  n_euler_steps: 10
  use_ema: true
  freeze_backbone: true